name: construction-copy-c
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone and Python libraries
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          python3 -m pip install --user --break-system-packages pypdf python-pptx

      - name: Configure rclone from the secret
        env:
          SECTION: ${{ secrets.SHINTIRU_RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$SECTION" > ~/.config/rclone/rclone.conf
          body=$(awk '/^\[shintiru\]/{f=1;next} /^\[/{f=0} f' ~/.config/rclone/rclone.conf)
          {
            echo "[srcC]"; echo "$body"; echo "root_folder_id = 1510EYViYMfzau3nAnMTD_eFxaOIXfdPv"; echo
          } >> ~/.config/rclone/rclone.conf

      - name: List the source folder
        run: |
          rclone lsjson -R --files-only srcC: > lsjson_C.json
          python3 -c "import json; print('source files:', len(json.load(open('lsjson_C.json'))))"

      - name: Copy the folder into "Construction and management"
        run: |
          rclone copy srcC: "shintiru:Construction and management/BBIT course material" --drive-chunk-size 64M -q

      - name: Verify the copy on the destination
        run: |
          rclone check srcC: "shintiru:Construction and management/BBIT course material" --one-way

      - name: Stage files locally for counting
        run: |
          mkdir -p stage/C
          rclone copy srcC: stage/C -q
          echo "staged files: $(find stage/C -type f | wc -l)"

      - name: Build the manifest
        run: |
          mkdir -p manifest
          python3 scripts/manifest_any.py stage/C lsjson_C.json "BBIT course material" "Construction and management/BBIT course material" manifest

      - name: Upload manifest to the Drive destination
        run: |
          rclone copyto manifest/MANIFEST.csv "shintiru:Construction and management/BBIT course material/MANIFEST.csv"
          rclone copyto manifest/MANIFEST.md "shintiru:Construction and management/BBIT course material/MANIFEST.md"
